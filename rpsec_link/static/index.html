<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RPsec Link — Host Remoto</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #000000;
      --bg-auth: radial-gradient(circle at 50% 25%, #1e293b 0%, #030712 85%);
      --bg-card: rgba(17, 24, 39, 0.94);
      --border-card: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --input-bg: #0b0f19;
      --input-border: #334155;
      --input-text: #f8fafc;
      --toolbar-bg: rgba(15, 23, 42, 0.96);
      --toolbar-border: rgba(255, 255, 255, 0.15);
      --btn-bg: #1e293b;
      --btn-border: #334155;
      --btn-text: #cbd5e1;
      --btn-hover: #334155;
      --btn-hover-text: #ffffff;
      --brand-blue: #0284c7;
      --brand-cyan: #38bdf8;
      --shadow-card: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
      --pill-bg: rgba(15, 23, 42, 0.88);
      --pill-border: rgba(56, 189, 248, 0.4);
      --pill-text: #38bdf8;
    }

    body.theme-light {
      --bg-page: #f8fafc;
      --bg-auth: radial-gradient(circle at 50% 25%, #f1f5f9 0%, #e2e8f0 85%);
      --bg-card: rgba(255, 255, 255, 0.98);
      --border-card: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
      --toolbar-bg: rgba(255, 255, 255, 0.98);
      --toolbar-border: #e2e8f0;
      --btn-bg: #f1f5f9;
      --btn-border: #cbd5e1;
      --btn-text: #334155;
      --btn-hover: #e2e8f0;
      --btn-hover-text: #0f172a;
      --brand-blue: #0284c7;
      --brand-cyan: #0284c7;
      --shadow-card: 0 20px 40px -10px rgba(0, 0, 0, 0.15);
      --pill-bg: rgba(255, 255, 255, 0.92);
      --pill-border: rgba(2, 132, 199, 0.35);
      --pill-text: #0284c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Tela de Autenticação / PIN */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: var(--bg-auth);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .auth-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 430px;
      box-shadow: var(--shadow-card);
      text-align: center;
      position: relative;
      transition: transform 0.2s;
    }
    .auth-card.shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    .auth-theme-btn {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--btn-text);
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .auth-theme-btn:hover {
      background: var(--btn-hover);
      color: var(--btn-hover-text);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.95rem;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid var(--pill-border);
      color: var(--brand-cyan);
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    .auth-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }
    .auth-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    /* Mensagem de Erro e Bloqueio */
    #authMessage {
      display: none;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      text-align: center;
      line-height: 1.4;
    }
    #authMessage.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
    }
    #authMessage.info {
      display: block;
      background: rgba(2, 132, 199, 0.15);
      border: 1px solid rgba(2, 132, 199, 0.4);
      color: var(--brand-cyan);
    }
    #authMessage.success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
    }
    #authMessage.locked {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
    }

    .pin-input {
      width: 100%;
      padding: 1.1rem;
      background: var(--input-bg);
      border: 2px solid var(--input-border);
      border-radius: 14px;
      color: var(--input-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      text-align: center;
      letter-spacing: 0.35em;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1.25rem;
    }
    .pin-input:focus {
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.25);
    }
    .pin-input:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-connect {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.5);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-connect:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-connect:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Viewport da Máquina */
    #viewportContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bg-page);
      overflow: hidden;
      outline: none;
    }
    #remoteCanvas {
      display: block;
      cursor: default;
      outline: none;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      transition: width 0.15s, height 0.15s;
    }
    #remoteCanvas.mode-fit {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    #remoteCanvas.mode-fill {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: fill;
    }
    #remoteCanvas.mode-original {
      max-width: none;
      max-height: none;
    }

    /* WIDGET FLUTUANTE RECOLHÍVEL & ARRASTÁVEL (Não bloqueia botões — ▢ ✕) */
    #floatingWidget {
      position: fixed;
      top: 8px;
      left: 120px; /* Posicionado longe do topo direito! */
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      cursor: move;
    }

    /* Pílula Compacta Inicial */
    #widgetPill {
      background: var(--pill-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--pill-border);
      border-radius: 10px;
      padding: 0.35rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--pill-text);
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s;
    }
    #widgetPill:hover {
      background: var(--brand-blue);
      color: #ffffff;
      border-color: var(--brand-blue);
    }

    /* Painel Completo de Opções (Aparece ao Clicar na Pílula) */
    #widgetPanel {
      display: none;
      margin-top: 6px;
      background: var(--toolbar-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--toolbar-border);
      border-radius: 14px;
      padding: 0.5rem 0.85rem;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.5);
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    #widgetPanel.open {
      display: flex;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .stat-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .stat-badge strong {
      color: var(--text-primary);
    }

    .tb-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
    }
    .tb-btn:hover {
      background: var(--btn-hover);
      color: var(--btn-hover-text);
    }
    .tb-btn-danger {
      background: rgba(239, 68, 68, 0.18) !important;
      color: #ef4444 !important;
      border-color: rgba(239, 68, 68, 0.45) !important;
      font-weight: 700 !important;
    }
    .tb-btn-danger:hover {
      background: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
    }
    .tb-select {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--btn-border);
      padding: 0.35rem 0.55rem;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    #mobileKeyTrap {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
    }
  </style>
</head>
<body>

  <!-- Tela de Login com PIN e Proteção Anti-Força Bruta -->
  <div id="authOverlay">
    <div id="authCard" class="auth-card">
      <button id="btnLoginTheme" class="auth-theme-btn" title="Alternar Tema Claro / Escuro">🌙</button>
      <div class="brand-badge">⚡ RPsecti Soluções</div>
      <h1 class="auth-title">RPsec Link</h1>
      <p class="auth-desc">Conexão Segura ao Host Remoto</p>
      
      <div id="authMessage"></div>

      <input type="password" id="pinInput" class="pin-input" placeholder="PIN" maxlength="8" autofocus>
      <button id="btnConnect" class="btn-connect">Conectar à Máquina</button>
    </div>
  </div>

  <!-- WIDGET FLUTUANTE RECOLHÍVEL & ARRASTÁVEL (Não obstrui o topo direito!) -->
  <div id="floatingWidget">
    <div id="widgetPill" title="Clique para abrir/fechar opções de conexão (Arraste para mover)">
      <span class="status-dot" id="pillStatusDot"></span>
      <span>⚡ RPsec Link</span>
      <span id="pillArrow">▾</span>
    </div>

    <!-- Painel Expansível de Controles -->
    <div id="widgetPanel">
      <div class="stat-badge"><span id="fpsCount">--</span> FPS • <span id="pingCount">--</span>ms • <span id="devicesBadge">👥 1</span></div>
      
      <!-- Modos de Exibição -->
      <select id="scaleSelect" class="tb-select" title="Modo de Exibição">
        <option value="fit" selected>Ajustar à Janela (Fit)</option>
        <option value="fill">Preencher 100% (Sem Bordas)</option>
        <option value="original">Resolução 1:1 Nativa</option>
      </select>

      <!-- Perfil de Rede / Qualidade -->
      <select id="qualitySelect" class="tb-select" title="Perfil de Rede e Qualidade">
        <option value="turbo">🚀 Turbo (Rede Local • 30 FPS)</option>
        <option value="balanced" selected>⚡ Equilibrado (Wi-Fi Padrão • 25 FPS)</option>
        <option value="weak">🌐 Rede Fraca (4G / Instável • 18 FPS)</option>
        <option value="ultra">🪶 Ultra-Econômico (Lenta • 12 FPS)</option>
      </select>

      <!-- Alternador de Tema -->
      <button id="btnToggleTheme" class="tb-btn" title="Alternar Tema Claro / Escuro">🌙</button>

      <!-- Atalhos de Sistema -->
      <button id="btnWin" class="tb-btn" title="Pressionar Tecla Windows">⊞ Win</button>
      <button id="btnAltTab" class="tb-btn" title="Alternar Janelas">Alt+Tab</button>
      <button id="btnCtrlAltDel" class="tb-btn" title="Enviar Ctrl+Alt+Del">Ctrl+Alt+Del</button>
      <button id="btnEsc" class="tb-btn" title="Pressionar Esc">Esc</button>
      <button id="btnMobileKbd" class="tb-btn" title="Abrir Teclado no Tablet/Celular">⌨ Teclado</button>
      <button id="btnFullscreen" class="tb-btn" title="Modo Tela Cheia Imersivo">⛶ Tela Cheia</button>
      <button id="btnClosePanel" class="tb-btn" title="Recolher Barra">▲</button>
      <button id="btnDisconnectOthers" class="tb-btn" style="display:none; color: #f59e0b;" title="Desconectar Outros Dispositivos">⚡ Desconectar Outros</button>
      <button id="btnDisconnect" class="tb-btn tb-btn-danger" title="Encerrar Sessão Remota">🔴 Desconectar</button>
    </div>
  </div>

  <!-- Viewport da Máquina Remota -->
  <div id="viewportContainer" tabindex="0">
    <canvas id="remoteCanvas" class="mode-fit"></canvas>
  </div>

  <input type="text" id="mobileKeyTrap">

  <script>
    const authOverlay = document.getElementById('authOverlay');
    const authCard = document.getElementById('authCard');
    const authMessage = document.getElementById('authMessage');
    const pinInput = document.getElementById('pinInput');
    const btnConnect = document.getElementById('btnConnect');
    const btnLoginTheme = document.getElementById('btnLoginTheme');
    const btnToggleTheme = document.getElementById('btnToggleTheme');
    
    // Widget flutuante
    const floatingWidget = document.getElementById('floatingWidget');
    const widgetPill = document.getElementById('widgetPill');
    const widgetPanel = document.getElementById('widgetPanel');
    const pillArrow = document.getElementById('pillArrow');
    const btnClosePanel = document.getElementById('btnClosePanel');
    const pillStatusDot = document.getElementById('pillStatusDot');

    const fpsCount = document.getElementById('fpsCount');
    const pingCount = document.getElementById('pingCount');
    const qualitySelect = document.getElementById('qualitySelect');
    const scaleSelect = document.getElementById('scaleSelect');
    const container = document.getElementById('viewportContainer');
    const canvas = document.getElementById('remoteCanvas');
    const ctx = canvas.getContext('2d');
    const mobileKeyTrap = document.getElementById('mobileKeyTrap');

    let ws = null;
    let remoteWidth = 1920;
    let remoteHeight = 1080;
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let currentFps = 0;
    let lastMouseMove = 0;
    let lockoutTimer = null;

    // Gerenciamento de Tema (Escuro / Claro)
    let currentTheme = localStorage.getItem('rpsec_link_theme') || 'dark';
    applyTheme(currentTheme);

    function applyTheme(theme) {
      currentTheme = theme;
      localStorage.setItem('rpsec_link_theme', theme);
      if (theme === 'light') {
        document.body.classList.add('theme-light');
        btnLoginTheme.textContent = '☀️';
        btnToggleTheme.textContent = '☀️';
      } else {
        document.body.classList.remove('theme-light');
        btnLoginTheme.textContent = '🌙';
        btnToggleTheme.textContent = '🌙';
      }
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    btnLoginTheme.addEventListener('click', toggleTheme);
    btnToggleTheme.addEventListener('click', toggleTheme);

    // Sistema de Abrir / Recolher o Widget Flutuante
    widgetPill.addEventListener('click', () => {
      widgetPanel.classList.toggle('open');
      pillArrow.textContent = widgetPanel.classList.contains('open') ? '▲' : '▾';
    });
    btnClosePanel.addEventListener('click', () => {
      widgetPanel.classList.remove('open');
      pillArrow.textContent = '▾';
    });

    // Torna o Widget Flutuante Arrastável para qualquer canto
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;

    widgetPill.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStartX = e.clientX - floatingWidget.offsetLeft;
      dragStartY = e.clientY - floatingWidget.offsetTop;
      e.stopPropagation();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const x = Math.max(10, Math.min(window.innerWidth - 150, e.clientX - dragStartX));
      const y = Math.max(5, Math.min(window.innerHeight - 80, e.clientY - dragStartY));
      floatingWidget.style.left = `${x}px`;
      floatingWidget.style.top = `${y}px`;
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Conexão com PIN e Tratamento de Erros / Bloqueio
    const savedPin = localStorage.getItem('rpsec_link_pin');
    if (savedPin) {
      pinInput.value = savedPin;
    }

    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });
    btnConnect.addEventListener('click', connect);

    let pendingBlob = null;
    let isRendering = false;

    async function renderFrame() {
      if (!pendingBlob) {
        isRendering = false;
        return;
      }
      isRendering = true;
      const blobToRender = pendingBlob;
      pendingBlob = null; // Descarta quadros defasados acumulados na fila

      try {
        const bitmap = await createImageBitmap(blobToRender);
        if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
        }
        ctx.drawImage(bitmap, 0, 0);
        bitmap.close();

        frameCount++;
        const now = performance.now();
        if (now - lastFpsUpdate >= 1000) {
          currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
          fpsCount.textContent = currentFps;
          frameCount = 0;
          lastFpsUpdate = now;
        }
      } catch (err) {
        // Frame descartado/corrompido
      } finally {
        if (pendingBlob) {
          requestAnimationFrame(renderFrame);
        } else {
          isRendering = false;
        }
      }
    }

    function connect() {
      const pin = pinInput.value.trim();
      if (!pin) {
        showNotice("Por favor, digite o PIN de acesso.", "error");
        return;
      }
      localStorage.setItem('rpsec_link_pin', pin);

      btnConnect.disabled = true;
      btnConnect.textContent = "Conectando...";
      authMessage.style.display = 'none';

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws?pin=${encodeURIComponent(pin)}`;

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        // Conexão autorizada
        btnConnect.disabled = false;
        btnConnect.textContent = "Conectar à Máquina";
      };

      ws.onmessage = async (event) => {
        if (event.data instanceof Blob) {
          // Frame de imagem JPEG da máquina remota com renderização sem acúmulo de fila
          pendingBlob = event.data;
          if (!isRendering) {
            renderFrame();
          }
        } else {
          try {
            const data = JSON.parse(event.data);

            if (data.type === 'auth_error') {
              btnConnect.disabled = false;
              btnConnect.textContent = "Conectar à Máquina";

              if (data.status === 'locked') {
                triggerLockout(data.seconds);
              } else {
                showNotice(data.message || `PIN incorreto! Restam ${data.attempts_left} tentativas.`, "error");
              }
              return;
            }

            if (data.type === 'server_disconnect') {
              showNotice(data.message || "A sessão remota foi encerrada pelo Host.", "info");
              if (ws) ws.close();
              return;
            }

            if (data.type === 'init') {
              remoteWidth = data.width;
              remoteHeight = data.height;
              if (data.devices) {
                updateDevicesBadge(data.devices);
              }
              // Esconde tela de autenticação
              authOverlay.style.display = 'none';
              pillStatusDot.classList.remove('offline');
              container.focus();
              sendQualityConfig();
              startPingLoop();
            } else if (data.type === 'devices_list') {
              updateDevicesBadge(data.devices || []);
            } else if (data.type === 'pong') {
              const rtt = Math.round(performance.now() - data.ts);
              pingCount.textContent = rtt;
            }
          } catch (e) {}
        }
      };

      ws.onclose = () => {
        pillStatusDot.classList.add('offline');
        fpsCount.textContent = '--';
        pingCount.textContent = '--';
        btnConnect.disabled = false;
        btnConnect.textContent = "Conectar à Máquina";
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function showNotice(msg, type = "error") {
      authMessage.className = type;
      authMessage.textContent = msg;
      authMessage.style.display = "block";
      authOverlay.style.display = "flex";
      if (type === "error") {
        authCard.classList.remove('shake');
        void authCard.offsetWidth; // Trigger reflow
        authCard.classList.add('shake');
      }
      pinInput.focus();
      if (type === "error") {
        pinInput.select();
      }
    }

    function triggerLockout(seconds) {
      clearInterval(lockoutTimer);
      pinInput.disabled = true;
      btnConnect.disabled = true;
      authMessage.className = "locked";

      let remaining = seconds;
      authMessage.textContent = `🔒 Bloqueado por excesso de tentativas. Tente novamente em ${remaining}s...`;

      lockoutTimer = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(lockoutTimer);
          pinInput.disabled = false;
          btnConnect.disabled = false;
          authMessage.className = "error";
          authMessage.textContent = "✓ Você já pode tentar novamente com o PIN correto.";
          pinInput.focus();
          pinInput.select();
        } else {
          authMessage.textContent = `🔒 Bloqueado por excesso de tentativas. Tente novamente em ${remaining}s...`;
        }
      }, 1000);
    }

    function startPingLoop() {
      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping', ts: performance.now() }));
        }
      }, 2000);
    }

    function sendQualityConfig() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const profile = qualitySelect.value;
      ws.send(JSON.stringify({ type: 'quality', profile }));
    }
    qualitySelect.addEventListener('change', sendQualityConfig);

    scaleSelect.addEventListener('change', () => {
      canvas.className = `mode-${scaleSelect.value}`;
    });

    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y))
      };
    }

    canvas.addEventListener('mousemove', (e) => {
      const now = performance.now();
      if (now - lastMouseMove < 16) return;
      lastMouseMove = now;

      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: 'mouse_move', x, y }));
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      container.focus();
      const { x, y } = getNormalizedCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({ type: 'mouse_down', button, x, y }));
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const { x, y } = getNormalizedCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({ type: 'mouse_up', button, x, y }));
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'wheel', delta: -Math.sign(e.deltaY) * 120 }));
    }, { passive: false });

    // Envio Robusto de Teclado (Físico + Caracteres)
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === pinInput) return;
      if (['Tab', 'Backspace', 'F5', 'Alt', 'Meta'].includes(e.key)) {
        e.preventDefault();
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'key_down', key: e.key, code: e.code }));
    });

    window.addEventListener('keyup', (e) => {
      if (document.activeElement === pinInput) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'key_up', key: e.key, code: e.code }));
    });

    // Atalhos do Painel
    document.getElementById('btnWin').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shortcut', shortcut: 'win' }));
      }
    });

    document.getElementById('btnAltTab').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shortcut', shortcut: 'alt+tab' }));
      }
    });

    document.getElementById('btnCtrlAltDel').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shortcut', shortcut: 'ctrl+alt+del' }));
      }
    });

    document.getElementById('btnEsc').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'key_down', key: 'Escape', code: 'Escape' }));
        setTimeout(() => ws.send(JSON.stringify({ type: 'key_up', key: 'Escape', code: 'Escape' })), 50);
      }
    });

    document.getElementById('btnMobileKbd').addEventListener('click', () => {
      mobileKeyTrap.focus();
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    const devicesBadge = document.getElementById('devicesBadge');
    const btnDisconnectOthers = document.getElementById('btnDisconnectOthers');

    function updateDevicesBadge(devs) {
      if (!devicesBadge) return;
      const count = devs.length;
      devicesBadge.textContent = `👥 ${count}`;
      if (btnDisconnectOthers) {
        btnDisconnectOthers.style.display = count > 1 ? 'inline-flex' : 'none';
      }
    }

    if (btnDisconnectOthers) {
      btnDisconnectOthers.addEventListener('click', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'disconnect_other_devices' }));
        }
      });
    }

    function disconnectSession() {
      if (ws) {
        try {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'client_disconnect' }));
          }
          ws.close(1000, "Desconectado pelo usuário");
        } catch (e) {}
      }
      pillStatusDot.classList.add('offline');
      fpsCount.textContent = '--';
      pingCount.textContent = '--';
      showNotice("✓ Sessão remota encerrada com sucesso.", "success");
    }

    document.getElementById('btnDisconnect').addEventListener('click', disconnectSession);
  </script>
</body>
</html>
