<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RPsec Link — Host Remoto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    /* Tela de Autenticação / PIN */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 25%, #1e293b 0%, #030712 85%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .auth-card {
      background: rgba(17, 24, 39, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 2.75rem 2.25rem;
      width: 100%;
      max-width: 430px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8);
      text-align: center;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.95rem;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.35);
      color: #38bdf8;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }
    .auth-title {
      font-size: 1.85rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    .auth-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 1.75rem;
    }
    .pin-input {
      width: 100%;
      padding: 1.1rem;
      background: #0b0f19;
      border: 2px solid #334155;
      border-radius: 14px;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.75rem;
      text-align: center;
      letter-spacing: 0.35em;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1.25rem;
    }
    .pin-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
    }
    .btn-connect {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(2, 132, 199, 0.5);
      transition: transform 0.15s, opacity 0.15s;
    }
    .btn-connect:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* Container de Visão da Máquina */
    #viewportContainer {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000000;
      overflow: hidden;
      outline: none;
    }
    #remoteCanvas {
      display: block;
      cursor: default;
      outline: none;
      transition: width 0.15s, height 0.15s;
    }
    /* Modos de visualização */
    #remoteCanvas.mode-fit {
      max-width: 100vw;
      max-height: 100vh;
      width: auto;
      height: auto;
      object-fit: contain;
    }
    #remoteCanvas.mode-fill {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: fill;
    }
    #remoteCanvas.mode-original {
      max-width: none;
      max-height: none;
    }

    /* Top Notch / Gaveta Retrátil Inteligente */
    #toolbarZone {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
    }
    #toolbarTab {
      width: 60px;
      height: 8px;
      background: rgba(56, 189, 248, 0.4);
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      transition: background 0.2s, height 0.2s;
    }
    #toolbarZone:hover #toolbarTab,
    #toolbarContainer:hover #toolbarTab {
      background: #38bdf8;
      height: 10px;
    }

    #toolbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-105%);
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-top: none;
      border-radius: 0 0 16px 16px;
      padding: 0.5rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1001;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Revela a barra quando o mouse se aproxima do topo ou quando fixada */
    #toolbarZone:hover ~ #toolbar,
    #toolbar:hover,
    #toolbar.pinned {
      transform: translateX(-50%) translateY(0);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }
    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }
    .stat-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      white-space: nowrap;
    }
    .stat-badge strong {
      color: #f8fafc;
    }
    .tb-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      white-space: nowrap;
    }
    .tb-btn:hover {
      background: #334155;
      color: #ffffff;
      border-color: #475569;
    }
    .tb-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .tb-select {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Input escondido para acionar teclado virtual em tablets/celulares */
    #mobileKeyTrap {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      left: -9999px;
    }
  </style>
</head>
<body>

  <!-- Tela de Login com PIN -->
  <div id="authOverlay">
    <div class="auth-card">
      <div class="brand-badge">⚡ RPsecti Soluções</div>
      <h1 class="auth-title">RPsec Link</h1>
      <p class="auth-desc">Conexão Direta ao Host Remoto</p>
      
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" autofocus>
      <button id="btnConnect" class="btn-connect">Conectar à Máquina</button>
    </div>
  </div>

  <!-- Zona Sensível de Ativação do Top Notch -->
  <div id="toolbarZone">
    <div id="toolbarTab" title="Passe o mouse para abrir controles"></div>
  </div>

  <!-- Barra de Ferramentas Retrátil (Desliza para baixo ao aproximar) -->
  <div id="toolbar">
    <div id="statusDot" class="status-dot"></div>
    <div class="stat-badge"><span id="fpsCount">--</span> FPS • <span id="pingCount">--</span>ms</div>
    
    <!-- Ajuste de Escala/Exibição -->
    <select id="scaleSelect" class="tb-select" title="Modo de Exibição">
      <option value="fit" selected>Ajustar à Janela (Fit)</option>
      <option value="fill">Preencher 100% (Sem Bordas)</option>
      <option value="original">Resolução 1:1</option>
    </select>

    <!-- Qualidade do Stream -->
    <select id="qualitySelect" class="tb-select" title="Qualidade da Transmissão">
      <option value="high">Alta (75% • 30 FPS)</option>
      <option value="medium" selected>Média (60% • 22 FPS)</option>
      <option value="fast">Rápida (45% • 15 FPS)</option>
    </select>

    <!-- Teclas Rápidas -->
    <button id="btnWin" class="tb-btn" title="Pressionar Tecla Windows">⊞ Win</button>
    <button id="btnAltTab" class="tb-btn" title="Alternar Janelas">Alt+Tab</button>
    <button id="btnEsc" class="tb-btn" title="Pressionar Esc">Esc</button>
    <button id="btnMobileKbd" class="tb-btn" title="Abrir Teclado no Tablet/Celular">⌨ Teclado</button>
    <button id="btnFullscreen" class="tb-btn" title="Modo Tela Cheia Imersivo">⛶ Tela Cheia</button>
    <button id="btnPinBar" class="tb-btn" title="Fixar/Ocultar Barra Superior">📌</button>
    <button id="btnDisconnect" class="tb-btn" style="color: #f87171;" title="Encerrar Sessão">✕</button>
  </div>

  <!-- Viewport da Máquina Remota -->
  <div id="viewportContainer" tabindex="0">
    <canvas id="remoteCanvas" class="mode-fit"></canvas>
  </div>

  <input type="text" id="mobileKeyTrap">

  <script>
    const authOverlay = document.getElementById('authOverlay');
    const pinInput = document.getElementById('pinInput');
    const btnConnect = document.getElementById('btnConnect');
    const toolbar = document.getElementById('toolbar');
    const btnPinBar = document.getElementById('btnPinBar');
    const statusDot = document.getElementById('statusDot');
    const fpsCount = document.getElementById('fpsCount');
    const pingCount = document.getElementById('pingCount');
    const qualitySelect = document.getElementById('qualitySelect');
    const scaleSelect = document.getElementById('scaleSelect');
    const container = document.getElementById('viewportContainer');
    const canvas = document.getElementById('remoteCanvas');
    const ctx = canvas.getContext('2d');
    const mobileKeyTrap = document.getElementById('mobileKeyTrap');

    let ws = null;
    let remoteWidth = 1920;
    let remoteHeight = 1080;
    let frameCount = 0;
    let lastFpsUpdate = performance.now();
    let currentFps = 0;
    let lastMouseMove = 0;
    let isPinned = false;

    // Recupera PIN salvo no navegador
    const savedPin = localStorage.getItem('rpsec_link_pin');
    if (savedPin) {
      pinInput.value = savedPin;
    }

    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') connect();
    });
    btnConnect.addEventListener('click', connect);

    function connect() {
      const pin = pinInput.value.trim();
      if (!pin) return;
      localStorage.setItem('rpsec_link_pin', pin);

      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws?pin=${encodeURIComponent(pin)}`;

      ws = new WebSocket(wsUrl);
      ws.binaryType = 'blob';

      ws.onopen = () => {
        authOverlay.style.display = 'none';
        statusDot.classList.remove('offline');
        container.focus();
        sendQualityConfig();
        startPingLoop();
      };

      ws.onmessage = async (event) => {
        if (event.data instanceof Blob) {
          const bitmap = await createImageBitmap(event.data);
          if (canvas.width !== bitmap.width || canvas.height !== bitmap.height) {
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
          }
          ctx.drawImage(bitmap, 0, 0);
          bitmap.close();

          frameCount++;
          const now = performance.now();
          if (now - lastFpsUpdate >= 1000) {
            currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
            fpsCount.textContent = currentFps;
            frameCount = 0;
            lastFpsUpdate = now;
          }
        } else {
          try {
            const data = JSON.parse(event.data);
            if (data.type === 'init') {
              remoteWidth = data.width;
              remoteHeight = data.height;
            } else if (data.type === 'pong') {
              const rtt = Math.round(performance.now() - data.ts);
              pingCount.textContent = rtt;
            }
          } catch (e) {}
        }
      };

      ws.onclose = () => {
        statusDot.classList.add('offline');
        fpsCount.textContent = '--';
        pingCount.textContent = '--';
        authOverlay.style.display = 'flex';
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function startPingLoop() {
      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping', ts: performance.now() }));
        }
      }, 2000);
    }

    function sendQualityConfig() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const val = qualitySelect.value;
      let quality = 60, scale = 1.0, fps = 22;
      if (val === 'high') {
        quality = 75; scale = 1.0; fps = 30;
      } else if (val === 'fast') {
        quality = 45; scale = 0.8; fps = 15;
      }
      ws.send(JSON.stringify({ type: 'quality', quality, scale, fps }));
    }
    qualitySelect.addEventListener('change', sendQualityConfig);

    // Modos de Exibição
    scaleSelect.addEventListener('change', () => {
      canvas.className = `mode-${scaleSelect.value}`;
    });

    // Fixar ou Retrair a Barra Superior
    btnPinBar.addEventListener('click', () => {
      isPinned = !isPinned;
      toolbar.classList.toggle('pinned', isPinned);
      btnPinBar.classList.toggle('active', isPinned);
    });

    // Converte posição do mouse no Canvas em coordenadas normalizadas (0.0 a 1.0)
    function getNormalizedCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y))
      };
    }

    // Eventos do Mouse
    canvas.addEventListener('mousemove', (e) => {
      const now = performance.now();
      if (now - lastMouseMove < 16) return;
      lastMouseMove = now;

      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const { x, y } = getNormalizedCoords(e);
      ws.send(JSON.stringify({ type: 'mouse_move', x, y }));
    });

    canvas.addEventListener('mousedown', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      container.focus();
      const { x, y } = getNormalizedCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({ type: 'mouse_down', button, x, y }));
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      const { x, y } = getNormalizedCoords(e);
      const button = e.button === 2 ? 'right' : (e.button === 1 ? 'middle' : 'left');
      ws.send(JSON.stringify({ type: 'mouse_up', button, x, y }));
    });

    canvas.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'wheel', delta: -Math.sign(e.deltaY) * 120 }));
    }, { passive: false });

    // Eventos do Teclado
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === pinInput) return;
      if (['Tab', 'Backspace', 'F5', 'Alt', 'Meta'].includes(e.key)) {
        e.preventDefault();
      }
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'key_down', key: e.key, code: e.code }));
    });

    window.addEventListener('keyup', (e) => {
      if (document.activeElement === pinInput) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'key_up', key: e.key, code: e.code }));
    });

    // Atalhos Rápidos
    document.getElementById('btnWin').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shortcut', shortcut: 'win' }));
      }
    });

    document.getElementById('btnAltTab').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'shortcut', shortcut: 'alt+tab' }));
      }
    });

    document.getElementById('btnEsc').addEventListener('click', () => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'key_down', key: 'Escape', code: 'Escape' }));
        setTimeout(() => ws.send(JSON.stringify({ type: 'key_up', key: 'Escape', code: 'Escape' })), 50);
      }
    });

    document.getElementById('btnMobileKbd').addEventListener('click', () => {
      mobileKeyTrap.focus();
    });

    // Tela Cheia Nativa (F11 / Imersão Total)
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    document.getElementById('btnDisconnect').addEventListener('click', () => {
      if (ws) ws.close();
    });
  </script>
</body>
</html>
